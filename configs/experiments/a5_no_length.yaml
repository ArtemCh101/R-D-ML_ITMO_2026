base: common.yaml
experiment: a5_no_length
title: Абляция – без группы "длина и разнообразие"
hypothesis: >
  Проверяем уникальный вклад длины отрывка и лексического разнообразия
  (n_chars, n_words, type_token_ratio) при наличии остальных групп.
ablation:
  of: e2_ridgecv_features
  removes: [features:length]
  expected: >
    Незначимо: n_words и type_token_ratio слабо связаны с таргетом (|r| < 0.2), а n_chars
    при почти фиксированной длине отрывка дублирует chars_per_word.
model:
  name: linear_text
  use_tfidf: true
  feature_groups: [sentence, word, formulas, familiarity]
  tuning: nested_loo
